name: Bug report
description: Report a reproducible problem in Zen
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Zen issue. Please keep reports focused on the Markdown, search, code-reading, and Git/GitHub workflows this project supports.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zen version or commit
      description: Include the app version or commit hash if available.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and any relevant project details.
    validations:
      required: false
